<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <filter id="wc">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#fdf8f2"/>
      <stop offset="100%" stop-color="#ede0f7" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Sky / background -->
  <rect width="600" height="450" fill="url(#sky)"/>

  <!-- Ground -->
  <ellipse cx="300" cy="420" rx="340" ry="60" fill="#a0c4b0" opacity="0.35" filter="url(#wc)"/>
  <rect x="0" y="380" width="600" height="80" fill="#dff0e7" opacity="0.5"/>

  <!-- Stars in sky -->
  <circle cx="80"  cy="60"  r="3" fill="#c4a0e0" opacity="0.7"/>
  <circle cx="200" cy="35"  r="2" fill="#c4a0e0" opacity="0.6"/>
  <circle cx="420" cy="50"  r="3" fill="#c4a0e0" opacity="0.8"/>
  <circle cx="520" cy="30"  r="2" fill="#c4a0e0" opacity="0.5"/>
  <circle cx="150" cy="90"  r="2" fill="#8a5aaa" opacity="0.5"/>
  <circle cx="480" cy="80"  r="2.5" fill="#c4a0e0" opacity="0.6"/>

  <!-- Crashed spaceship -->
  <g transform="translate(320, 230) rotate(-18)" filter="url(#wc)">
    <!-- Ship body -->
    <ellipse cx="0" cy="0" rx="80" ry="35" fill="#b084d8" opacity="0.9"/>
    <ellipse cx="0" cy="-18" rx="45" ry="22" fill="#c4a0e0" opacity="0.85"/>
    <!-- Window -->
    <circle cx="0" cy="-14" r="12" fill="#ede0f7" opacity="0.9"/>
    <circle cx="0" cy="-14" r="8"  fill="#fdf8f2" opacity="0.7"/>
    <!-- Legs (bent/broken) -->
    <line x1="-30" y1="20"  x2="-45" y2="45"  stroke="#8a5aaa" stroke-width="5" stroke-linecap="round"/>
    <line x1="30"  y1="20"  x2="50"  y2="40"  stroke="#8a5aaa" stroke-width="5" stroke-linecap="round"/>
    <!-- Sparks / steam -->
    <circle cx="60"  cy="-10" r="6"  fill="#fdf8f2" opacity="0.5"/>
    <circle cx="70"  cy="-20" r="4"  fill="#fdf8f2" opacity="0.35"/>
    <circle cx="80"  cy="-5"  r="3"  fill="#fdf8f2" opacity="0.25"/>
  </g>

  <!-- Smoke puffs -->
  <circle cx="415" cy="185" r="22" fill="#fdf8f2" opacity="0.55" filter="url(#wc)"/>
  <circle cx="440" cy="165" r="16" fill="#fdf8f2" opacity="0.40" filter="url(#wc)"/>
  <circle cx="430" cy="145" r="10" fill="#fdf8f2" opacity="0.25" filter="url(#wc)"/>

  <!-- Alien Zib (purple) -->
  <g transform="translate(155, 290)">
    <ellipse cx="0" cy="28" rx="20" ry="26" fill="#8a5aaa" opacity="0.9"/>
    <circle cx="0" cy="0"  r="22" fill="#a070cc"/>
    <circle cx="-8" cy="-2" r="5" fill="#ede0f7"/>
    <circle cx="8"  cy="-2" r="5" fill="#ede0f7"/>
    <circle cx="-8" cy="-2" r="2.5" fill="#3a2d4a"/>
    <circle cx="8"  cy="-2" r="2.5" fill="#3a2d4a"/>
    <line x1="-6"  y1="-20" x2="-8"  y2="-30" stroke="#8a5aaa" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6"   y1="-20" x2="8"   y2="-30" stroke="#8a5aaa" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-8" cy="-31" r="3.5" fill="#c4a0e0"/>
    <circle cx="8"  cy="-31" r="3.5" fill="#c4a0e0"/>
    <!-- Dazed stars -->
    <text x="-30" y="-40" font-size="14" opacity="0.7">✦</text>
  </g>

  <!-- Alien Mara (green) -->
  <g transform="translate(230, 305)">
    <ellipse cx="0" cy="24" rx="18" ry="22" fill="#5a8a6a" opacity="0.9"/>
    <circle cx="0" cy="0"  r="20" fill="#70aa80"/>
    <ellipse cx="-7" cy="0" rx="5" ry="6" fill="#ede0f7"/>
    <ellipse cx="7"  cy="0" rx="5" ry="6" fill="#ede0f7"/>
    <circle cx="-7" cy="1" r="2.5" fill="#3a2d4a"/>
    <circle cx="7"  cy="1" r="2.5" fill="#3a2d4a"/>
    <ellipse cx="0" cy="-14" rx="13" ry="6" fill="#5a8a6a" opacity="0.75"/>
    <path d="M-6 10 Q0 14 6 10" stroke="#3a2d4a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Alien Pip (tiny, lavender) -->
  <g transform="translate(190, 330)">
    <ellipse cx="0" cy="18" rx="13" ry="16" fill="#c4a0e0" opacity="0.9"/>
    <circle cx="0" cy="0"  r="15" fill="#d8b8f0"/>
    <circle cx="-5" cy="-1" r="4" fill="#ede0f7"/>
    <circle cx="5"  cy="-1" r="4" fill="#ede0f7"/>
    <circle cx="-5" cy="-1" r="2" fill="#3a2d4a"/>
    <circle cx="5"  cy="-1" r="2" fill="#3a2d4a"/>
    <line x1="0" y1="-13" x2="0" y2="-20" stroke="#c4a0e0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-22" r="2.5" fill="#8a5aaa"/>
  </g>

  <!-- Grass tufts -->
  <g opacity="0.6">
    <path d="M50 395 Q55 370 60 395"  fill="none" stroke="#5a8a6a" stroke-width="3" stroke-linecap="round"/>
    <path d="M60 395 Q68 365 75 390"  fill="none" stroke="#5a8a6a" stroke-width="3" stroke-linecap="round"/>
    <path d="M500 390 Q506 368 512 390" fill="none" stroke="#5a8a6a" stroke-width="3" stroke-linecap="round"/>
    <path d="M512 392 Q520 372 527 390" fill="none" stroke="#5a8a6a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Caption watermark -->
  <text x="300" y="440" text-anchor="middle" font-size="11" fill="#9a8aaa" opacity="0.6" font-style="italic">Illustration placeholder — The Crash</text>
</svg>
