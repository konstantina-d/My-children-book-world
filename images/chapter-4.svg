<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="w4"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
    <radialGradient id="eve" cx="50%" cy="60%" r="75%">
      <stop offset="0%"   stop-color="#3a2d4a"/>
      <stop offset="60%"  stop-color="#5a3880"/>
      <stop offset="100%" stop-color="#8a5aaa" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c4a0e0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c4a0e0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Twilight sky -->
  <rect width="400" height="300" fill="url(#eve)"/>
  <!-- Horizon glow -->
  <ellipse cx="200" cy="290" rx="280" ry="80" fill="#8a5aaa" opacity="0.25" filter="url(#w4)"/>
  <!-- Stars -->
  <circle cx="30"  cy="20"  r="1.5" fill="white" opacity="0.9"/>
  <circle cx="80"  cy="45"  r="1"   fill="white" opacity="0.7"/>
  <circle cx="140" cy="15"  r="2"   fill="white" opacity="0.8"/>
  <circle cx="210" cy="35"  r="1.5" fill="white" opacity="0.9"/>
  <circle cx="270" cy="18"  r="1"   fill="white" opacity="0.7"/>
  <circle cx="340" cy="40"  r="1.5" fill="white" opacity="0.8"/>
  <circle cx="385" cy="22"  r="1"   fill="white" opacity="0.6"/>
  <circle cx="50"  cy="80"  r="1"   fill="white" opacity="0.6"/>
  <circle cx="380" cy="75"  r="1.5" fill="white" opacity="0.7"/>
  <circle cx="100" cy="100" r="1"   fill="white" opacity="0.5"/>
  <!-- Ship repaired, glowing, lifting off -->
  <g transform="translate(200, 120)">
    <!-- Engine glow -->
    <ellipse cx="0" cy="25" rx="50" ry="18" fill="url(#glow)" opacity="0.8"/>
    <ellipse cx="0" cy="28" rx="28" ry="10" fill="#c4a0e0" opacity="0.35" filter="url(#w4)"/>
    <!-- Ship body -->
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="#b084d8" opacity="0.95"/>
    <ellipse cx="0" cy="-12" rx="30" ry="16" fill="#c4a0e0" opacity="0.9"/>
    <!-- Window -->
    <circle cx="0" cy="-10" r="9" fill="#ede0f7" opacity="0.9"/>
    <circle cx="0" cy="-10" r="6" fill="white" opacity="0.6"/>
    <!-- Ring -->
    <ellipse cx="0" cy="0" rx="68" ry="14" fill="none" stroke="#8a5aaa" stroke-width="5" opacity="0.55"/>
    <ellipse cx="0" cy="0" rx="68" ry="14" fill="none" stroke="#ede0f7" stroke-width="2" opacity="0.3"/>
    <!-- Engine flames -->
    <ellipse cx="-18" cy="22" rx="7" ry="12" fill="#ffa060" opacity="0.7" filter="url(#w4)"/>
    <ellipse cx="0"   cy="25" rx="9" ry="14" fill="#ffcc80" opacity="0.65" filter="url(#w4)"/>
    <ellipse cx="18"  cy="22" rx="7" ry="12" fill="#ffa060" opacity="0.7" filter="url(#w4)"/>
  </g>
  <!-- Beam of light downward -->
  <polygon points="180,142 220,142 240,230 160,230" fill="#ede0f7" opacity="0.07"/>
  <!-- Ground / treehouse silhouette -->
  <rect x="0" y="245" width="400" height="65" fill="#1a1228" opacity="0.8"/>
  <!-- Tree silhouette -->
  <rect x="180" y="195" width="40" height="60" fill="#0e0a1a" opacity="0.7"/>
  <ellipse cx="200" cy="185" rx="70" ry="55" fill="#0e0a1a" opacity="0.65"/>
  <!-- Treehouse -->
  <rect x="138" y="195" width="124" height="50" fill="#160f28" opacity="0.7"/>
  <!-- Lighted window -->
  <rect x="162" y="205" width="30" height="28" rx="2" fill="#ffd870" opacity="0.5" filter="url(#w4)"/>
  <!-- Figures: Maya waving from ground, aliens in beam -->
  <!-- Maya -->
  <g transform="translate(100, 235)">
    <circle cx="0" cy="-8" r="10" fill="#c4a0e0" opacity="0.7"/>
    <rect x="-7" y="2" width="14" height="16" rx="3" fill="#c4a0e0" opacity="0.6"/>
    <!-- Wave arm -->
    <line x1="7" y1="5" x2="20" y2="-5" stroke="#c4a0e0" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Aliens in beam (floating up) -->
  <circle cx="190" cy="205" r="8"  fill="#b084d8" opacity="0.75"/>
  <circle cx="205" cy="192" r="7"  fill="#70aa80" opacity="0.75"/>
  <circle cx="195" cy="218" r="5.5" fill="#d8b8f0" opacity="0.75"/>
  <!-- Tiny wave hands -->
  <line x1="183" y1="210" x2="175" y2="218" stroke="#b084d8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Stars near ship -->
  <circle cx="270" cy="100" r="2.5" fill="#c4a0e0" opacity="0.8"/>
  <circle cx="130" cy="95"  r="2"   fill="#c4a0e0" opacity="0.7"/>
  <!-- Label -->
  <rect x="0" y="265" width="400" height="35" fill="#3a2d4a" opacity="0.7"/>
  <text x="200" y="287" text-anchor="middle" font-size="13" fill="#c4a0e0" font-family="Georgia,serif" font-style="italic">04 — Finding Home</text>
</svg>
