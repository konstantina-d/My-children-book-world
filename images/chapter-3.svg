<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="w3"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
    <radialGradient id="sunsky" cx="30%" cy="20%" r="70%">
      <stop offset="0%"   stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#dff0e7" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  <!-- Bright day sky -->
  <rect width="400" height="300" fill="url(#sunsky)"/>
  <!-- Sun -->
  <circle cx="60" cy="55" r="32" fill="#ffd870" opacity="0.55" filter="url(#w3)"/>
  <circle cx="60" cy="55" r="22" fill="#ffda60" opacity="0.7"/>
  <!-- Clouds -->
  <ellipse cx="240" cy="60"  rx="60" ry="28" fill="white" opacity="0.75" filter="url(#w3)"/>
  <ellipse cx="280" cy="50"  rx="45" ry="24" fill="white" opacity="0.65" filter="url(#w3)"/>
  <ellipse cx="350" cy="75"  rx="55" ry="24" fill="white" opacity="0.6" filter="url(#w3)"/>
  <!-- Rain (from small cloud) -->
  <ellipse cx="160" cy="90" rx="50" ry="22" fill="#b0c8e8" opacity="0.5" filter="url(#w3)"/>
  <line x1="138" y1="112" x2="130" y2="138" stroke="#90a8c8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="150" y1="114" x2="143" y2="140" stroke="#90a8c8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="162" y1="114" x2="156" y2="140" stroke="#90a8c8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="174" y1="112" x2="168" y2="138" stroke="#90a8c8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Rain puddle -->
  <ellipse cx="152" cy="232" rx="35" ry="10" fill="#b0c8e8" opacity="0.45" filter="url(#w3)"/>
  <!-- Ice cream cart (simple) -->
  <rect x="290" y="185" width="70" height="55" rx="5" fill="#ede0f7" opacity="0.9"/>
  <rect x="290" y="180" width="70" height="15" rx="4" fill="#8a5aaa" opacity="0.8"/>
  <text x="325" y="222" text-anchor="middle" font-size="11" fill="#8a5aaa" font-family="sans-serif">🍦</text>
  <!-- Cart wheels -->
  <circle cx="302" cy="242" r="8" fill="#c4a0e0" opacity="0.8"/>
  <circle cx="348" cy="242" r="8" fill="#c4a0e0" opacity="0.8"/>

  <!-- Ground -->
  <rect x="0" y="235" width="400" height="80" fill="#dff0e7" opacity="0.5"/>
  <ellipse cx="200" cy="240" rx="250" ry="20" fill="#a0c4b0" opacity="0.3" filter="url(#w3)"/>

  <!-- Maya with ice cream -->
  <g transform="translate(210, 195)">
    <ellipse cx="0" cy="35" rx="18" ry="22" fill="#c4a0e0" opacity="0.85"/>
    <circle cx="0" cy="10"  r="18" fill="#d8b8f0" opacity="0.9"/>
    <!-- Hair -->
    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#8a5aaa" opacity="0.8"/>
    <circle cx="-8" cy="9" r="5"  fill="#ede0f7"/>
    <circle cx="8"  cy="9" r="5"  fill="#ede0f7"/>
    <circle cx="-8" cy="10" r="2.5" fill="#3a2d4a"/>
    <circle cx="8"  cy="10" r="2.5" fill="#3a2d4a"/>
    <!-- Ice cream held up -->
    <line x1="14" y1="25" x2="28" y2="10" stroke="#c4a0e0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="30" cy="6" r="7" fill="#ffb8c8" opacity="0.9"/>
  </g>

  <!-- Zib looking at puddle -->
  <g transform="translate(115, 210)">
    <ellipse cx="0" cy="26" rx="16" ry="20" fill="#8a5aaa" opacity="0.9"/>
    <circle cx="0" cy="6"  r="17" fill="#a070cc"/>
    <circle cx="-6" cy="4" r="4.5" fill="#ede0f7"/>
    <circle cx="6"  cy="4" r="4.5" fill="#ede0f7"/>
    <circle cx="-6" cy="4" r="2"   fill="#3a2d4a"/>
    <circle cx="6"  cy="4" r="2"   fill="#3a2d4a"/>
    <line x1="-4" y1="-11" x2="-5" y2="-19" stroke="#8a5aaa" stroke-width="2" stroke-linecap="round"/>
    <line x1="4"  y1="-11" x2="5"  y2="-19" stroke="#8a5aaa" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-5" cy="-20" r="3" fill="#c4a0e0"/>
    <circle cx="5"  cy="-20" r="3" fill="#c4a0e0"/>
    <!-- Zib touching puddle -->
    <line x1="14" y1="30" x2="28" y2="42" stroke="#a070cc" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="30" cy="44" r="3.5" fill="#90a8c8" opacity="0.8"/>
  </g>

  <!-- Mara with musical notes -->
  <g transform="translate(255, 205)">
    <ellipse cx="0" cy="23" rx="14" ry="18" fill="#5a8a6a" opacity="0.9"/>
    <circle cx="0" cy="5"  r="15" fill="#70aa80"/>
    <ellipse cx="-5" cy="4" rx="4" ry="5" fill="#ede0f7"/>
    <ellipse cx="5"  cy="4" rx="4" ry="5" fill="#ede0f7"/>
    <circle cx="-5" cy="5" r="2" fill="#3a2d4a"/>
    <circle cx="5"  cy="5" r="2" fill="#3a2d4a"/>
    <path d="M-4 11 Q0 15 4 11" stroke="#3a2d4a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Music notes -->
  <text x="275" y="198" font-size="14" fill="#5a8a6a" opacity="0.7">♪</text>
  <text x="290" y="188" font-size="10" fill="#5a8a6a" opacity="0.5">♫</text>

  <!-- Label -->
  <rect x="0" y="265" width="400" height="35" fill="#5a8a6a" opacity="0.12"/>
  <text x="200" y="287" text-anchor="middle" font-size="13" fill="#5a8a6a" font-family="Georgia,serif" font-style="italic">03 — Earth Lessons</text>
</svg>
