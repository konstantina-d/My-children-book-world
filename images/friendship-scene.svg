<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <filter id="wc2">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="warmsky" cx="50%" cy="40%" r="65%">
      <stop offset="0%"   stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#dff0e7" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c8a060"/>
      <stop offset="100%" stop-color="#a07840"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#warmsky)"/>

  <!-- Background foliage blobs -->
  <ellipse cx="300" cy="120" rx="280" ry="100" fill="#5a8a6a" opacity="0.18" filter="url(#wc2)"/>
  <ellipse cx="120" cy="150" rx="140" ry="90"  fill="#70aa80" opacity="0.15" filter="url(#wc2)"/>
  <ellipse cx="480" cy="130" rx="130" ry="80"  fill="#5a8a6a" opacity="0.13" filter="url(#wc2)"/>

  <!-- Main tree trunk -->
  <rect x="262" y="300" width="76" height="160" rx="10" fill="url(#woodGrad)" opacity="0.9"/>
  <!-- Bark texture -->
  <line x1="280" y1="320" x2="285" y2="390" stroke="#8a6030" stroke-width="1.5" opacity="0.4"/>
  <line x1="300" y1="310" x2="305" y2="395" stroke="#8a6030" stroke-width="1.5" opacity="0.4"/>
  <line x1="318" y1="325" x2="320" y2="385" stroke="#8a6030" stroke-width="1.5" opacity="0.3"/>

  <!-- Branches -->
  <path d="M285 340 Q200 310 150 280" stroke="url(#woodGrad)" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M315 360 Q400 320 460 290" stroke="url(#woodGrad)" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M300 330 Q300 260 300 220" stroke="url(#woodGrad)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- Leaf clusters -->
  <ellipse cx="150" cy="250" rx="90" ry="70"  fill="#5a8a6a" opacity="0.8" filter="url(#wc2)"/>
  <ellipse cx="460" cy="258" rx="85" ry="65"  fill="#5a8a6a" opacity="0.75" filter="url(#wc2)"/>
  <ellipse cx="300" cy="185" rx="100" ry="80" fill="#70aa80" opacity="0.82" filter="url(#wc2)"/>
  <!-- Leaf highlights -->
  <ellipse cx="155" cy="238" rx="50" ry="35" fill="#a0c4b0" opacity="0.35" filter="url(#wc2)"/>
  <ellipse cx="295" cy="172" rx="55" ry="38" fill="#a0c4b0" opacity="0.3"  filter="url(#wc2)"/>

  <!-- Treehouse platform -->
  <rect x="120" y="270" width="360" height="18" rx="6" fill="#b88c50" opacity="0.95"/>
  <!-- Platform planks lines -->
  <line x1="175" y1="271" x2="175" y2="287" stroke="#8a6030" stroke-width="1" opacity="0.5"/>
  <line x1="230" y1="271" x2="230" y2="287" stroke="#8a6030" stroke-width="1" opacity="0.5"/>
  <line x1="370" y1="271" x2="370" y2="287" stroke="#8a6030" stroke-width="1" opacity="0.5"/>
  <line x1="420" y1="271" x2="420" y2="287" stroke="#8a6030" stroke-width="1" opacity="0.5"/>

  <!-- Treehouse walls -->
  <rect x="150" y="185" width="300" height="90" rx="4" fill="#d4a860" opacity="0.92"/>
  <!-- Wall planks -->
  <line x1="210" y1="186" x2="210" y2="274" stroke="#b88c50" stroke-width="1.5" opacity="0.4"/>
  <line x1="270" y1="186" x2="270" y2="274" stroke="#b88c50" stroke-width="1.5" opacity="0.4"/>
  <line x1="330" y1="186" x2="330" y2="274" stroke="#b88c50" stroke-width="1.5" opacity="0.4"/>
  <line x1="390" y1="186" x2="390" y2="274" stroke="#b88c50" stroke-width="1.5" opacity="0.4"/>

  <!-- Roof -->
  <polygon points="135,190 300,140 465,190" fill="#8a5aaa" opacity="0.85"/>
  <polygon points="135,190 300,140 465,190" fill="none" stroke="#c4a0e0" stroke-width="2" opacity="0.5"/>
  <!-- Roof tiles hint -->
  <line x1="195" y1="175" x2="240" y2="167" stroke="#7040a0" stroke-width="1" opacity="0.4"/>
  <line x1="360" y1="167" x2="405" y2="175" stroke="#7040a0" stroke-width="1" opacity="0.4"/>

  <!-- Windows -->
  <rect x="170" y="210" width="55" height="45" rx="4" fill="#ede0f7" opacity="0.85"/>
  <rect x="375" y="210" width="55" height="45" rx="4" fill="#ede0f7" opacity="0.85"/>
  <!-- Window panes -->
  <line x1="197" y1="210" x2="197" y2="255" stroke="#c4a0e0" stroke-width="1.5" opacity="0.6"/>
  <line x1="170" y1="233" x2="225" y2="233" stroke="#c4a0e0" stroke-width="1.5" opacity="0.6"/>
  <line x1="402" y1="210" x2="402" y2="255" stroke="#c4a0e0" stroke-width="1.5" opacity="0.6"/>
  <line x1="375" y1="233" x2="430" y2="233" stroke="#c4a0e0" stroke-width="1.5" opacity="0.6"/>

  <!-- Door -->
  <rect x="262" y="225" width="76" height="49" rx="4" fill="#b88c50" opacity="0.9"/>
  <circle cx="330" cy="250" r="4" fill="#8a6030" opacity="0.8"/>

  <!-- Rope ladder -->
  <line x1="220" y1="288" x2="210" y2="380" stroke="#b88c50" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="288" x2="240" y2="380" stroke="#b88c50" stroke-width="3" stroke-linecap="round"/>
  <line x1="213" y1="310" x2="243" y2="308" stroke="#b88c50" stroke-width="2.5"/>
  <line x1="215" y1="330" x2="245" y2="328" stroke="#b88c50" stroke-width="2.5"/>
  <line x1="217" y1="350" x2="247" y2="348" stroke="#b88c50" stroke-width="2.5"/>

  <!-- Figures in window (silhouettes) -->
  <!-- Maya -->
  <circle cx="197" cy="222" r="7" fill="#8a5aaa" opacity="0.7"/>
  <rect x="192" y="229" width="10" height="14" rx="3" fill="#8a5aaa" opacity="0.6"/>
  <!-- Zib -->
  <circle cx="402" cy="220" r="6" fill="#b084d8" opacity="0.7"/>
  <!-- Antenna on Zib -->
  <line x1="402" y1="215" x2="402" y2="209" stroke="#b084d8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="402" cy="208" r="2" fill="#c4a0e0"/>
  <rect x="398" y="226" width="9" height="12" rx="2" fill="#b084d8" opacity="0.6"/>

  <!-- Stars / fireflies around treehouse -->
  <circle cx="100" cy="200" r="3" fill="#c4a0e0" opacity="0.6"/>
  <circle cx="510" cy="220" r="2.5" fill="#c4a0e0" opacity="0.7"/>
  <circle cx="80"  cy="310" r="2" fill="#a0c4b0" opacity="0.5"/>
  <circle cx="530" cy="330" r="3" fill="#a0c4b0" opacity="0.55"/>
  <circle cx="550" cy="180" r="2" fill="#c4a0e0" opacity="0.5"/>

  <!-- Ground -->
  <ellipse cx="300" cy="430" rx="320" ry="50" fill="#a0c4b0" opacity="0.25" filter="url(#wc2)"/>
  <rect x="0" y="400" width="600" height="60" fill="#dff0e7" opacity="0.45"/>

  <!-- Caption -->
  <text x="300" y="443" text-anchor="middle" font-size="11" fill="#9a8aaa" opacity="0.6" font-style="italic">Illustration placeholder — The Treehouse</text>
</svg>
